<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job History - AutoApp</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/autoapp.css">
    <script src="js/common.js"></script>
    <script src="js/rerun.js"></script>
    <script src="js/history.js"></script>
    <script defer src="vendor/alpine-3.17.4.min.js"></script>
</head>
<body>
<div id="app-chrome" data-title="Job History"></div>

<main x-data="jobHistory()">
    <form class="panel" @submit.prevent="search()" aria-label="Search criteria">
        <div class="criteria">
            <fieldset>
                <legend>Run</legend>
                <label>Job <input type="text" x-model="criteria.job_key" name="job_key" data-lookup="jobs"></label>
                <label>Type
                    <select x-model="criteria.job_type" name="job_type">
                        <option value="">Any</option><option value="STEPS">Jobs</option><option value="WORKFLOW">Workflows</option>
                    </select>
                </label>
                <label title="A run's ID: that run and the runs inside it, as a workflow's job runs">Within run
                    <input type="text" x-model="criteria.within" name="within"></label>
                <label>Status
                    <select x-model="criteria.status" name="status">
                        <option value="">Any</option><option>SUCCESS</option><option>FAILED</option><option>RUNNING</option>
                    </select>
                </label>
                <label title="Late means a deadline was missed at some point; the mark stays after the run catches up">Late
                    <select x-model="criteria.late" name="late">
                        <option value="">Any</option><option value="true">Marked late</option><option value="false">Never late</option>
                    </select>
                </label>
            </fieldset>
            <fieldset>
                <legend>Scheduler</legend>
                <label title="The scheduler's instance ID, exactly as it issued it">Instance ID
                    <input type="text" x-model="criteria.instance_id" name="instance_id"></label>
                <label>Scheduler <input type="text" x-model="criteria.scheduler" name="scheduler" data-lookup="schedulers"></label>
            </fieldset>
            <fieldset>
                <legend>Started</legend>
                <label>From <input type="datetime-local" x-model="criteria.date_from" name="date_from"></label>
                <label>To <input type="datetime-local" x-model="criteria.date_to" name="date_to"></label>
            </fieldset>
        </div>
        <div class="actions">
            <button type="submit" class="primary" :disabled="loading">Search</button>
            <button type="button" class="secondary" @click="clear()" :disabled="loading">Clear</button>
            <span class="spacer"></span>
            <button type="button" class="secondary" @click="exportCsv()" :disabled="rows.length === 0">Export as CSV</button>
        </div>
    </form>

    <section class="panel" aria-label="Results" x-cloak>
        <p class="message error" x-show="error" x-text="error" role="alert"></p>
        <p class="message" id="result-summary" x-show="!error" x-text="summary"></p>
        <p class="message capped" x-show="capped">Only the newest <span x-text="rows.length"></span> are shown.</p>
        <div data-rerun-panel></div>
        <div class="table-scroll" x-show="rows.length > 0">
            <table class="results">
                <thead><tr><th>Job</th><th>Status</th><th>Late</th><th>Started</th><th>Took</th><th>Scheduler</th><th>Files</th><th>Log</th></tr></thead>
                <tbody>
                    <template x-for="run in shownRows" :key="run.run_id">
                        <tr :class="{ inside: run.depth > 0 }" :data-depth="run.depth">
                            <td :style="`padding-left: ${8 + run.depth * 22}px`">
                                <button type="button" class="tool unfold" x-show="run.child_count" @click="toggle(run)"
                                        :title="unfolded[run.run_id] ? 'Fold' : 'Show the runs inside it'"
                                        :aria-expanded="Boolean(unfolded[run.run_id])"
                                        x-text="(unfolded[run.run_id] ? '▾ ' : '▸ ') + insideWords(run)"></button>
                                <a class="job-key" :href="jobLink(run)" x-text="run.job_key"></a>
                                <template x-if="run.job_type === 'WORKFLOW'"><span class="tag">Workflow</span></template>
                                <div class="small" x-show="run.job_type === 'WORKFLOW'">
                                    <a class="inside-link" :href="withinLink(run.run_id)">This run and its jobs</a></div>
                                <div class="muted small" x-show="run.parent_run_id && run.depth === 0">
                                    in a <a class="parent-link" :href="withinLink(run.parent_run_id)">workflow run</a>
                                    as <span x-text="run.workflow_path"></span></div>
                            </td>
                            <td>
                                <span class="status" :class="run.status" x-text="run.status"></span>
                                <span class="muted small" x-show="run.return_code !== null && run.return_code !== undefined"
                                      x-text="'return code ' + run.return_code"></span>
                                <span class="muted small counted" x-show="run.status_before_override"
                                      x-text="'(counted; it ended ' + run.status_before_override + ')'"></span>
                                <span class="muted small restarted" x-show="run.restarts_count > 0" :title="run.restarts_words"
                                      x-text="'Restarted ×' + run.restarts_count"></span>
                                <div class="error-text small" x-show="run.error" x-text="run.error"></div>
                            </td>
                            <td class="late-cell">
                                <span class="tag late" x-show="run.late" x-text="'Late'"></span>
                                <div class="muted small late-reason" x-show="run.late" x-text="run.late_reason"></div>
                                <div class="muted small late-cause" x-show="run.late && run.late_cause" x-text="run.late_cause"></div>
                            </td>
                            <td class="nowrap" x-text="time(run.started)"></td>
                            <td class="nowrap" x-text="duration(run)"></td>
                            <td>
                                instance <span x-text="run.instance_id"></span>
                                <span x-show="run.run_number > 1" x-text="'· run ' + run.run_number"></span>
                                <div class="muted small" x-show="run.scheduler" x-text="'scheduler ' + run.scheduler"></div>
                                <div class="muted small" x-show="run.business_date" x-text="'business date ' + run.business_date"></div>
                                <div class="muted small" x-show="run.host" x-text="'on ' + run.host"></div>
                            </td>
                            <td class="nowrap">
                                <a class="files" :href="operationsLink(run)"
                                   x-text="run.operations + (run.operations === 1 ? ' operation' : ' operations')"></a>
                                <div class="error-text small" x-show="run.failed_operations" x-text="run.failed_operations + ' failed'"></div>
                            </td>
                            <td class="nowrap">
                                <a class="run-log" :href="logLink(run)" x-show="run.has_log || run.status === 'RUNNING'">Log</a>
                                <span class="muted small" x-show="!run.has_log && run.status !== 'RUNNING'">None kept</span>
                                <div><button type="button" class="secondary rerun-row" x-show="canRerun(run)"
                                             @click="rerunRow = run; openRerun(run.run_id)">Rerun &#9656;</button></div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
