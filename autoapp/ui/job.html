<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Detail - AutoApp</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/autoapp.css">
    <script src="js/common.js"></script>
    <script src="js/job.js"></script>
    <script defer src="vendor/alpine-3.17.4.min.js"></script>
</head>
<body>
<div id="app-chrome" data-title="Job Detail" data-nav="jobs.html"></div>

<main x-data="jobDetail()">

    <!-- Selector and the page's buttons. The page arrives locked; Edit unlocks it. -->
    <div class="panel selector">
        <label for="job-selector" x-show="!embedded">Job</label>
        <!-- Inside a scheduler the page is for one job: say which -->
        <span class="embedded-job" x-show="embedded" x-text="job ? job.job_key : 'New AutoApp job'"></span>
        <input id="job-selector" type="text" list="job-keys" x-model="chosen" @change="choose()" x-show="!embedded"
               placeholder="Type to find a job" autocomplete="off" :disabled="editing">
        <datalist id="job-keys">
            <template x-for="jobKey in allKeys" :key="jobKey"><option :value="jobKey"></option></template>
        </datalist>
        <!-- The registered endpoints, offered as a drop-down on every endpoint box below.
             Typing in the box narrows the list. -->
        <datalist id="endpoint-names">
            <template x-for="endpoint in endpoints" :key="endpoint.name">
                <option :value="endpoint.name" :label="endpointLabel(endpoint)"></option>
            </template>
        </datalist>
        <span class="spacer"></span>
        <a class="button secondary" href="job.html?new" x-show="!editing && !embedded">New job</a>
        <a class="button secondary" id="run-job-button" x-show="job && !editing"
           :href="job ? 'run.html?' + new URLSearchParams({ key: job.job_key }) : '#'">Run</a>
        <button type="button" class="secondary" id="edit-button" x-show="form && !editing" @click="edit()">Edit</button>
        <button type="button" class="secondary danger" id="delete-button" x-show="editing && job" :disabled="busy"
                @click="remove()">Delete job</button>
        <button type="button" class="secondary" id="cancel-button" x-show="editing" :disabled="busy" @click="cancel()">Cancel</button>
        <button type="button" class="primary" id="submit-button" x-show="editing" :disabled="busy || !changed"
                @click="submit()">Submit</button>
    </div>

    <p class="message error" id="page-error" x-show="error" x-text="error" role="alert" x-cloak></p>
    <p class="message saved" id="save-notice" x-show="notice" x-text="notice" role="status" x-cloak></p>
    <p class="message" id="choose-prompt" x-show="!form && !error && !key" x-cloak>Choose a job above, or find one on the
        <a href="jobs.html">Job Search</a> page.</p>

    <template x-if="form">
        <!-- x-effect: whenever anything in the form changes, ask what it would now resolve to -->
        <div x-effect="queuePreview(JSON.stringify(payload()))">
            <!-- The job itself -->
            <section class="panel" aria-label="Job">
                <div class="detail-grid">
                    <label for="job-key">Job key <span class="required" title="Required">*</span></label>
                    <div>
                        <input id="job-key" type="text" x-model="form.job_key" :disabled="!editing" maxlength="320"
                               placeholder="For example DEV-LEGAL-COLLECT">
                        <span class="muted small" x-show="editing">The job's name, which the scheduler passes to run it.
                            Letters, digits, hyphens, underscores and full stops.</span>
                    </div>

                    <label for="job-description">Description</label>
                    <textarea id="job-description" rows="2" x-model="form.description" :disabled="!editing"></textarea>

                    <label for="job-enabled">Enabled</label>
                    <div><input id="job-enabled" type="checkbox" x-model="form.active" :disabled="!editing"></div>

                    <span class="label">Would it run?</span>
                    <div id="runnability">
                        <span class="muted" x-show="!form.active">Disabled. The runner refuses a disabled job.</span>
                        <span class="ready-text" x-show="form.active && verdict && verdict.valid">Ready to run</span>
                        <span class="status FAILED" x-show="problems.length > 0"
                              x-text="problems.length + (problems.length === 1 ? ' problem' : ' problems') + ' found by the pre-run check'"></span>
                        <span class="muted small" id="unsaved-note" x-show="changed">(as it is on screen, not yet saved)</span>
                    </div>

                    <template x-if="job">
                        <span class="label">Run it with</span>
                    </template>
                    <template x-if="job">
                        <code id="command-line" x-text="commandLine"></code>
                    </template>

                    <template x-if="job">
                        <span class="label">History</span>
                    </template>
                    <template x-if="job">
                        <div class="muted small">
                            Created <span x-text="time(job.created)"></span> by <span x-text="job.created_by"></span><span
                                x-show="job.modified">; last changed <span x-text="time(job.modified)"></span>
                                by <span x-text="job.modified_by"></span></span>.
                            <a :href="operationsLink">See its operations</a>
                        </div>
                    </template>
                </div>

                <ul class="problems" id="job-problems" x-show="problems.length > 0">
                    <template x-for="problem in problems"><li x-text="problem"></li></template>
                </ul>
                <!-- Worth knowing, but they do not stop the job: tags disagreeing about a variable it does not use -->
                <ul class="warnings" id="job-warnings" x-show="warnings.length > 0">
                    <template x-for="warning in warnings"><li class="message warning small" x-text="warning"></li></template>
                </ul>
            </section>

            <!-- Its variables: values of the job's own, written ${Name} in any step value -->
            <section class="panel" aria-label="Variables">
                <div class="steps-head">
                    <h2 class="section">Variables</h2>
                    <span class="muted small">Write <code>${Name}</code> in any step value to use one.</span>
                </div>
                <p class="message" id="no-variables" x-show="form.variables.length === 0">This job has no variables of its own.</p>

                <div class="table-scroll" x-show="form.variables.length > 0">
                    <table class="results variables">
                        <thead>
                            <tr><th>Name</th><th>Value</th><th>Secret</th><th>Description</th><th></th></tr>
                        </thead>
                        <tbody>
                            <template x-for="(variable, index) in form.variables" :key="variable.uid">
                                <tr :data-variable="variable.uid">
                                    <td><input type="text" class="variable-name" x-model="variable.name" :disabled="!editing"
                                               maxlength="100" placeholder="For example ArchiveFolder" aria-label="Variable name"></td>
                                    <td><input :type="variable.secret ? 'password' : 'text'" class="variable-value" x-model="variable.value"
                                               :disabled="!editing" aria-label="Variable value" autocomplete="off"
                                               :placeholder="variable.secret && variable.savedSecret ? 'Set. Type a new value to replace it.' : ''"></td>
                                    <td><input type="checkbox" class="variable-secret" x-model="variable.secret" :disabled="!editing"
                                               title="A secret's value is hidden here, in the job log and in previews, and is never sent back to this page"
                                               aria-label="Secret"></td>
                                    <td><input type="text" class="variable-description" x-model="variable.description" :disabled="!editing"
                                               aria-label="Variable description"></td>
                                    <td><button type="button" class="link remove-variable" x-show="editing"
                                                @click="removeVariable(index)">Remove</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="actions" x-show="editing">
                    <button type="button" class="secondary" id="add-variable" @click="addVariable()">Add variable</button>
                </div>

                <!-- Then what its tags give it, and lowest of all what the scheduler sets -->
                <div data-tags-give></div>

                <!-- Opened for one of a scheduler's jobs: the parameters it sets in the environment when it runs the job -->
                <template x-if="wla">
                    <div id="wla-parameters">
                        <h3 class="small">From the scheduler: <span x-text="wla.scheduler"></span>'s job <code x-text="wla.job"></code></h3>
                        <p class="message error small" id="wla-error" x-show="wlaError" x-text="wlaError"></p>
                        <p class="muted small" x-show="wlaJob && wlaJob.parameters.length === 0">It has no parameters.</p>
                        <table class="results tag-variables compact" x-show="wlaJob && wlaJob.parameters.length > 0">
                            <thead><tr><th>Name</th><th>Value</th><th></th></tr></thead>
                            <tbody>
                                <template x-for="parameter in (wlaJob ? wlaJob.parameters : [])" :key="parameter.name">
                                    <tr :class="{ overridden: form.variables.some(v => v.name.trim() === parameter.name) }">
                                        <td><code x-text="parameter.name"></code></td>
                                        <td><code x-text="parameter.secret ? '********' : parameter.value"></code></td>
                                        <td class="muted small" x-text="parameter.secret ? 'secret' : ''"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <p class="muted small" x-show="wlaJob">Set in the scheduler, not here. They have the lowest priority:
                            a variable of the same name anywhere in AutoApp wins. <code>${ENV:Name}</code> names one directly.</p>
                    </div>
                </template>
                <p class="muted small" style="margin: 12px 0 0">
                    Always available: <code>${DATE:yyyyMMdd}</code> and other date masks, <code>${SYS:WORKING_FOLDER}</code>
                    and <code>${SYS:INSTANCE_ID}</code>; and in a rename mask, <code>${FILE:NAME}</code>,
                    <code>${FILE:STEM}</code> and <code>${FILE:EXT}</code>.
                </p>
            </section>

            <!-- Its tags, and the variables they give it -->
            <div data-tags-panel></div>

            <!-- Its steps, in the order they run -->
            <section class="panel" aria-label="Steps">
                <div class="steps-head">
                    <h2 class="section">Steps</h2>
                    <span class="spacer"></span>
                    <button type="button" class="link" @click="expandAll(true)" x-show="form.steps.length">Expand all</button>
                    <button type="button" class="link" @click="expandAll(false)" x-show="form.steps.length">Collapse all</button>
                </div>
                <p class="message" id="no-steps" x-show="form.steps.length === 0">This job has no steps.</p>

                <template x-for="(step, index) in form.steps" :key="step.uid">
                    <div class="step" :class="{ disabled: !step.active, open: step.open }">
                        <div class="step-head">
                            <button type="button" class="expander" @click="toggle(step)" :aria-expanded="step.open ? 'true' : 'false'"
                                    :title="step.open ? 'Hide parameters' : 'Show parameters'"
                                    x-text="step.open ? '▼' : '▶'"></button>
                            <span class="step-order" x-text="index + 1"></span>

                            <span class="step-title" x-show="!editing" x-text="step.title"></span>
                            <input type="text" class="step-title-input" x-show="editing" x-model="step.title"
                                   placeholder="What this step does" maxlength="150" aria-label="Step title">

                            <span class="tag" x-show="!editing" x-text="step.step_type_name"></span>
                            <select class="step-type" x-show="editing" x-model="step.step_type" @change="retype(step)" aria-label="Step type">
                                <template x-for="type in Object.values(catalog)" :key="type.code">
                                    <option :value="type.code" :selected="type.code === step.step_type" x-text="type.name"></option>
                                </template>
                                <!-- A step whose type this server does not have keeps it, shown by its code -->
                                <template x-if="!catalog[step.step_type]">
                                    <option :value="step.step_type" selected x-text="step.step_type"></option>
                                </template>
                            </select>

                            <span class="step-summary muted small" x-show="!step.open" x-text="summary(step)"></span>
                            <span class="spacer"></span>

                            <span class="step-tools" x-show="editing">
                                <button type="button" class="tool move-up" title="Move this step earlier" :disabled="index === 0"
                                        @click="move(index, -1)">▲</button>
                                <button type="button" class="tool move-down" title="Move this step later"
                                        :disabled="index === form.steps.length - 1" @click="move(index, 1)">▼</button>
                                <button type="button" class="link remove-step" @click="removeStep(index)">Remove</button>
                            </span>
                            <label class="inline"><input type="checkbox" class="step-enabled" x-model="step.active" :disabled="!editing"> Enabled</label>
                        </div>

                        <div class="step-body" x-show="step.open">
                            <p class="message error" x-show="!catalog[step.step_type]">
                                This server has no step type called <span x-text="step.step_type"></span>, so its form cannot be drawn.
                            </p>
                            <div class="detail-grid">
                                <template x-for="field in step.fields" :key="field.name">
                                    <div class="field-row" :data-parameter="field.name">
                                        <span class="label" :title="field.description">
                                            <span x-text="field.name"></span>
                                            <span class="required" x-show="field.required" title="Required">*</span>
                                        </span>

                                        <!-- A file location: a registered endpoint, or a path inside the working folder -->
                                        <template x-if="field.data_type === 'LOCATION'">
                                            <div class="location-choice">
                                                <label class="inline">
                                                    <input type="radio" value="endpoint" x-model="field.mode"
                                                           :name="'where-' + step.uid + '-' + field.name" :disabled="!editing">
                                                    Endpoint
                                                    <input type="text" class="endpoint-value" x-model="field.endpoint"
                                                           list="endpoint-names" autocomplete="off"
                                                           :disabled="!editing || field.mode !== 'endpoint'"
                                                           placeholder="Choose or type a registered endpoint">
                                                    <button type="button" class="link new-endpoint" x-show="editing"
                                                            title="Register a new endpoint without leaving this page"
                                                            @click="newEndpoint(field)">New...</button>
                                                </label>
                                                <span class="error-text small not-registered"
                                                      x-show="field.mode === 'endpoint' && field.endpoint.trim() && !isRegistered(field.endpoint)">
                                                    No endpoint is registered under this name.
                                                    <button type="button" class="link small register-it" x-show="editing"
                                                            @click="newEndpoint(field)">Register it</button></span>
                                                <label class="inline">
                                                    <input type="radio" value="path" x-model="field.mode"
                                                           :name="'where-' + step.uid + '-' + field.name" :disabled="!editing">
                                                    Working folder path
                                                    <input type="text" class="path-value" x-model="field.path"
                                                           :disabled="!editing || field.mode !== 'path'"
                                                           placeholder="For example incoming/*.csv">
                                                </label>
                                            </div>
                                        </template>

                                        <template x-if="field.data_type === 'BOOLEAN' && !field.asText">
                                            <div>
                                                <input type="checkbox" x-model="field.ticked" @change="field.set = true" :disabled="!editing">
                                                <span class="muted small" x-show="!field.set">default</span>
                                                <button type="button" class="link small reset-field" x-show="editing && field.set"
                                                        title="Stop storing a value for this step, so the step type's own setting applies"
                                                        @click="useDefault(field)">reset</button>
                                            </div>
                                        </template>

                                        <template x-if="field.data_type === 'CHOICE'">
                                            <div>
                                                <select x-model="field.text" :disabled="!editing">
                                                    <option value="" :selected="!field.text">(not set)</option>
                                                    <template x-for="choice in field.allowed_values" :key="choice">
                                                        <option :value="choice" :selected="choice === field.text" x-text="choice"></option>
                                                    </template>
                                                </select>
                                            </div>
                                        </template>

                                        <template x-if="field.data_type === 'TEXT'">
                                            <div class="text-field">
                                                <textarea class="code" :rows="textRows(field.text)" x-model="field.text" :disabled="!editing" :placeholder="field.default || ''"></textarea>
                                            </div>
                                        </template>

                                        <template x-if="['STRING', 'INTEGER'].includes(field.data_type) || field.asText">
                                            <div class="text-field">
                                                <input type="text" x-model="field.text" :disabled="!editing" :placeholder="field.default || ''">
                                            </div>
                                        </template>

                                        <span class="muted small field-help" x-text="field.description"></span>

                                        <!-- What the value really comes to, for the job as it is on screen. It runs the
                                             full width under the box and its description, so a long path stays on one line. -->
                                        <div class="field-preview">
                                            <span class="preview resolved" x-show="showsResolved(index, field)"
                                                  x-text="'→ ' + (previewOf(index, field) || {}).resolved"></span>
                                            <span class="preview error-text small"
                                                  x-show="(field.data_type !== 'LOCATION' || field.mode === 'path') && previewOf(index, field) && previewOf(index, field).error"
                                                  x-text="(previewOf(index, field) || {}).error"></span>
                                            <template x-for="name in (editing ? missingVariables(field.data_type === 'LOCATION' ? (field.mode === 'path' ? field.path : '') : field.text) : [])"
                                                      :key="name">
                                                <button type="button" class="link small add-missing" @click="addVariable(name)"
                                                        x-text="'Add variable ' + name"></button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="unknown-parameters" x-show="step.unknown.length > 0">
                                <p class="message error">Not parameters of this step type. The job will not run until they are removed:</p>
                                <template x-for="(extra, extraIndex) in step.unknown" :key="extra.name">
                                    <div class="field-row">
                                        <span class="label status FAILED" x-text="extra.name"></span>
                                        <div><input type="text" :value="extra.value" disabled></div>
                                        <button type="button" class="link remove-unknown" x-show="editing"
                                                @click="step.unknown.splice(extraIndex, 1)">Remove</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <div class="actions" x-show="editing">
                    <button type="button" class="secondary" id="add-step" @click="addStep()">Add step</button>
                </div>
            </section>
        </div>
    </template>

</main>
<script>AutoApp.fillTagPanels()</script>
</body>
</html>
