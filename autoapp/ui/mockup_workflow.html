<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workflow Mockup - AutoApp</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/autoapp.css">
    <script src="js/common.js"></script>
    <script src="vendor/elk-0.12.0.bundled.js"></script>
    <script src="js/mockup_workflow.js"></script>
    <style>
        /* Only this mockup's own looks; the real pages will move what survives into autoapp.css */
        :root, :root[data-theme="dark"] { --wf-rc: #b48cff; --wf-frame: #191c21; }
        :root[data-theme="light"] { --wf-rc: #6b3fb8; --wf-frame: #f7f8fa; }

        .mockup-note { color: var(--warning); margin: 0 0 12px; }
        .wf-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
        .wf-toolbar .group { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
        .wf-toolbar .group button { background: transparent; color: var(--text); border: 0; padding: 5px 12px; cursor: pointer; font: inherit; }
        .wf-toolbar .group button + button { border-left: 1px solid var(--border); }
        .wf-toolbar .group button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
        .wf-toolbar .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
        .wf-find { display: inline-flex; gap: 8px; align-items: center; }
        .wf-find input { width: 220px; }

        .wf-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
        @media (max-width: 900px) { .wf-body { grid-template-columns: 1fr; } }
        .wf-canvas { overflow: auto; max-height: 72vh; padding: 0; background: var(--page); }
        .wf-canvas svg { display: block; }
        .wf-side h2 { font-size: 15px; margin: 0 0 4px; overflow-wrap: anywhere; }
        .wf-side h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 14px 0 4px; }
        .wf-side ul { margin: 0; padding-left: 18px; }
        .wf-side li { margin: 2px 0; overflow-wrap: anywhere; }
        .wf-side .muted, .wf-outline .muted { color: var(--muted); }

        .wf-results { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
        .wf-results li { margin: 2px 0; }
        .wf-results button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-align: left; }

        .wf-outline { padding: 6px 4px; }
        .wf-outline ul { list-style: none; margin: 0; padding-left: 22px; }
        .wf-outline > ul { padding-left: 4px; }
        .wf-outline li { margin: 4px 0; }
        .wf-outline .row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; cursor: pointer; }
        .wf-outline .row .name { font-weight: 600; overflow-wrap: anywhere; }
        .wf-outline .row.found .name { outline: 2px solid var(--accent); outline-offset: 2px; }
        .wf-outline .needs { font-size: 12px; color: var(--muted); padding-left: 2px; }
        .wf-outline .section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; margin: 10px 0 2px; }

        .wf-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 24px; font-size: 13px; }
        .wf-legend .item { display: flex; align-items: center; gap: 10px; }
        .wf-legend svg { flex: none; }
        .wf-icon { vertical-align: -2px; color: var(--muted); }
        .wf-key summary { cursor: pointer; color: var(--muted); }
        .wf-key[open] summary { margin-bottom: 10px; }
        .wf-outside { display: inline-block; font-size: 12px; color: var(--warning); border: 1px dashed var(--warning); border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
<div id="app-chrome" data-title="Workflow Mockup"></div>

<main>
    <section class="panel">
        <p class="mockup-note">Mockup, for judging the look of the workflow diagram (docs/WORKFLOWS.md, Phase 2). The workflow is made up; nothing is saved or run.</p>
        <div class="wf-toolbar">
            <span class="label">Workflow</span> <strong>MONTH_END_BILLING</strong>
            <span class="group" aria-label="Mode">
                <button type="button" data-set="mode" data-value="editor">Editor</button>
                <button type="button" data-set="mode" data-value="run">A run in progress</button>
            </span>
            <span class="group" aria-label="View">
                <button type="button" data-set="view" data-value="diagram">Diagram</button>
                <button type="button" data-set="view" data-value="outline">Outline</button>
            </span>
            <span class="group" aria-label="Direction">
                <button type="button" data-set="direction" data-value="RIGHT">Left to right</button>
                <button type="button" data-set="direction" data-value="DOWN">Top to bottom</button>
            </span>
            <span class="group" aria-label="Zoom">
                <button type="button" data-zoom="-1" title="Smaller">−</button>
                <button type="button" data-zoom="0" title="Fit to window">Fit</button>
                <button type="button" data-zoom="1" title="Larger">+</button>
            </span>
            <span class="wf-find">
                <input type="search" id="find" placeholder="Find a job or workflow" aria-label="Find a job or workflow">
                <button type="button" class="secondary" id="show-matches">Show matches</button>
            </span>
        </div>
        <ul class="wf-results" id="results"></ul>
    </section>

    <div class="wf-body">
        <section class="panel wf-canvas" id="canvas" aria-label="Workflow"></section>
        <aside class="panel wf-side" id="side" aria-label="Selected"></aside>
    </div>

    <details class="panel wf-key">
        <summary>Key</summary>
        <div class="wf-legend" id="legend"></div>
    </details>
</main>
</body>
</html>
