<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workflow - AutoApp</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/autoapp.css">
    <script src="js/common.js"></script>
    <script src="js/reactions.js"></script>
    <script src="js/conditions.js"></script>
    <script src="vendor/elk-0.12.0.bundled.js"></script>
    <script src="js/workflow_diagram.js"></script>
    <script src="js/workflow.js"></script>
    <script defer src="vendor/alpine-3.17.4.min.js"></script>
</head>
<body>
<div id="app-chrome" data-title="Workflow" data-nav="jobs.html"></div>

<main x-data="workflowDetail()">

    <!-- Selector and the page's buttons. The page arrives locked; Edit unlocks it. -->
    <div class="panel selector">
        <label for="workflow-selector">Workflow</label>
        <input id="workflow-selector" type="text" list="workflow-keys" x-model="chosen" @change="choose()"
               placeholder="Type to find a workflow" autocomplete="off" :disabled="editing">
        <datalist id="workflow-keys">
            <template x-for="k in workflowKeys" :key="k"><option :value="k"></option></template>
        </datalist>
        <datalist id="job-keys">
            <template x-for="k in jobKeys" :key="k"><option :value="k"></option></template>
        </datalist>
        <span class="spacer"></span>
        <a class="button secondary" href="workflow.html?new" x-show="!editing">New workflow</a>
        <button type="button" class="secondary" id="run-button" x-show="job && !editing" :disabled="busy" @click="start()">Run</button>
        <button type="button" class="secondary" id="edit-button" x-show="form && !editing" @click="edit()">Edit</button>
        <button type="button" class="secondary danger" id="delete-button" x-show="editing && job" :disabled="busy"
                @click="remove()">Delete workflow</button>
        <button type="button" class="secondary" id="cancel-button" x-show="editing" :disabled="busy" @click="cancel()">Cancel</button>
        <button type="button" class="primary" id="submit-button" x-show="editing" :disabled="busy || !changed"
                @click="submit()">Save</button>
    </div>

    <p class="message error" id="page-error" x-show="error" x-text="error" role="alert" x-cloak></p>
    <p class="message saved" id="save-notice" x-show="notice" x-text="notice" role="status" x-cloak></p>
    <p class="message" x-show="!form && !error && !key" x-cloak>Choose a workflow above, or find one on the
        <a href="jobs.html?job_type=WORKFLOW">Job Search</a> page.</p>

    <!-- A run, shown in the same outline -->
    <template x-if="run">
        <section class="panel wf-run" aria-label="Run" id="run-panel">
            <div class="steps-head">
                <h2 class="section" style="margin-top: 0">Run <span class="muted small" x-text="run.instance_id"></span></h2>
                <span class="status" :class="run.status" id="run-status" x-text="runWords(run)"></span>
                <span class="muted small" x-show="run.started" x-text="'started ' + time(run.started)"></span>
                <span class="muted small" x-show="run.ended" x-text="'ended ' + time(run.ended)"></span>
                <span class="spacer"></span>
                <button type="button" class="secondary danger" id="cancel-run-button"
                        x-show="run.status === 'RUNNING' && !run.cancel_requested" @click="cancelRun()"
                        title="Start nothing more. The jobs running now finish.">Cancel what hasn't started</button>
                <span class="muted small" x-show="run.cancel_requested && !run.kill_requested && run.status === 'RUNNING'">Cancelling: waiting for the running jobs to finish</span>
                <button type="button" class="secondary danger" id="kill-run-button"
                        x-show="run.status === 'RUNNING' && !run.kill_requested" @click="killRun()"
                        title="Kill the jobs running now, and start nothing more">Kill and Cancel</button>
                <span class="muted small" x-show="run.kill_requested && run.status === 'RUNNING'">Killing</span>
                <a x-show="run.run_id" :href="logLink(run.run_id)">The workflow's log</a>
                <button type="button" class="link" @click="closeRun()">Close</button>
            </div>
            <p class="error-text" x-show="run.error" x-text="run.error"></p>
            <template x-for="(check, i) in checksFor(null)" :key="i">
                <div class="cond-explained run-succeeds-when">
                    <span class="small" x-text="'Succeeds when ' + (check.result === 'TRUE' ? 'held' : 'did not hold') + ':'"></span>
                    <ul class="cond-tree small">
                        <template x-for="(row, j) in explainRows(check)" :key="j">
                            <li :style="{ paddingLeft: (row.depth * 18) + 'px' }" :class="'answer-' + row.answer">
                                <span class="cond-answer" x-text="row.words"></span> <code x-text="row.text"></code></li>
                        </template>
                    </ul>
                    <div class="muted small" x-text="valuesWords(check.values)"></div>
                </div>
            </template>
            <div class="wf-body" x-show="view === 'diagram'">
                <div class="wf-canvas" id="run-diagram" x-effect="drawRun($el)"></div>
                <aside class="wf-side" id="run-side" aria-label="Selected job">
                    <p class="muted" x-show="!runItem">Select a box to see that job's run.</p>
                    <template x-if="runItem">
                        <div>
                            <h3 class="wf-name" x-text="runItem.name"></h3>
                            <div><span class="wf-state" :class="runItem.status" x-text="stateWords(runItem)"></span></div>
                            <div class="muted small" x-text="'job ' + runItem.job_key"></div>
                            <div class="muted small" x-show="runItem.started" x-text="'started ' + time(runItem.started)"></div>
                            <div class="muted small" x-show="runItem.ended" x-text="'ended ' + time(runItem.ended)"></div>
                            <a x-show="runItem.run_id" :href="logLink(runItem.run_id)">Its log</a>
                            <button type="button" class="secondary danger kill-item" x-show="runItem.status === 'RUNNING'"
                                    @click="killItem(runItem)">Kill</button>
                            <div class="muted small run-waiting" x-show="runItem.waiting_for" x-text="runItem.waiting_for"></div>
                            <div class="run-outside small" x-show="outsideFor(runItem.path).length">
                                <div class="muted">What it waited for outside:</div>
                                <ul class="cond-tree">
                                    <template x-for="(w, i) in outsideFor(runItem.path)" :key="i">
                                        <li :class="{ 'answer-true': w.result === 'HOLDS', 'answer-false': ['TIMED_OUT'].includes(w.result) }">
                                            <span class="cond-answer" x-text="{ WAITING: 'waiting:', HOLDS: 'held:', TIMED_OUT: 'ran out of patience:', SKIPPED: 'optional, given up:', NOT_NEEDED: 'not needed:' }[w.result]"></span>
                                            <span x-text="w.message"></span>
                                            <a x-show="w.used_run_id" :href="logLink(w.used_run_id)">the run it used</a>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                            <ul class="reaction-events small" x-show="eventsFor(runItem.path).length">
                                <template x-for="e in eventsFor(runItem.path)"><li x-text="e.message"></li></template>
                            </ul>
                            <div class="run-why small" x-show="waitedFor(runItem).length">
                                <div class="muted">It waited for:</div>
                                <ul class="cond-tree">
                                    <template x-for="(w, i) in waitedFor(runItem)" :key="i">
                                        <li :class="'answer-' + w.answer"><span class="cond-answer" x-text="w.words"></span> <span x-text="w.text"></span></li>
                                    </template>
                                </ul>
                            </div>
                            <template x-for="(check, i) in checksFor(runItem.path)" :key="i">
                                <div class="cond-explained run-rule small">
                                    <div class="muted" x-text="'Its Custom rule ' + (check.result === 'TRUE' ? 'held, so it started' : 'did not hold, so it did not run') + ':'"></div>
                                    <ul class="cond-tree">
                                        <template x-for="(row, j) in explainRows(check)" :key="j">
                                            <li :style="{ paddingLeft: (row.depth * 18) + 'px' }" :class="'answer-' + row.answer">
                                                <span class="cond-answer" x-text="row.words"></span> <code x-text="row.text"></code></li>
                                        </template>
                                    </ul>
                                    <div class="muted" x-text="valuesWords(check.values)"></div>
                                </div>
                            </template>
                        </div>
                    </template>
                </aside>
            </div>
            <ul class="wf-outline" id="run-items" x-show="view === 'outline'">
                <template x-for="item in runFlat" :key="item.path">
                    <li class="wf-row" :data-name="item.name" :data-path="item.path" :style="{ marginLeft: (item.depth * 22) + 'px' }">
                        <span class="wf-state" :class="item.status" x-text="stateWords(item)"></span>
                        <span class="wf-name" x-text="item.name"></span>
                        <span class="muted small" x-text="(item.frame_run_id ? 'workflow ' : 'job ') + item.job_key"></span>
                        <span class="muted small run-inside" x-show="item.frame_run_id" x-text="insideWords(item)"></span>
                        <a x-show="item.run_id || item.frame_run_id" :href="logLink(item.run_id || item.frame_run_id)">Log</a>
                        <button type="button" class="link small kill-item" x-show="item.status === 'RUNNING'" @click="killItem(item)">Kill</button>
                        <span class="muted small run-waiting" x-show="item.waiting_for" x-text="item.waiting_for"></span>
                        <template x-for="(check, i) in checksFor(item.path)" :key="i">
                            <span class="muted small run-rule-words" :title="check.condition"
                                  x-text="'Custom rule ' + (check.result === 'TRUE' ? 'held' : 'did not hold')"></span>
                        </template>
                    </li>
                </template>
            </ul>
            <details class="reaction-events" id="run-reactions" x-show="run.reactions && run.reactions.length">
                <summary x-text="'Reactions that fired: ' + (run.reactions || []).length"></summary>
                <ul class="small">
                    <template x-for="e in run.reactions || []"><li :class="{ muted: e.result !== 'TOOK_EFFECT' }"
                        x-text="(e.path ? e.path + ': ' : '') + e.message"></li></template>
                </ul>
            </details>
        </section>
    </template>

    <template x-if="form">
        <div>
            <section class="panel" aria-label="Workflow">
                <div class="detail-grid">
                    <label for="workflow-key">Workflow key <span class="required" title="Required">*</span></label>
                    <div>
                        <input id="workflow-key" type="text" x-model="form.job_key" :disabled="!editing" maxlength="320"
                               placeholder="For example MONTH_END_BILLING">
                        <span class="muted small" x-show="editing">Its name, like a job's: a scheduler starts a workflow
                            by its key, as it starts a job.</span>
                    </div>
                    <label for="workflow-description">Description</label>
                    <textarea id="workflow-description" rows="2" x-model="form.description" :disabled="!editing"></textarea>
                    <label for="workflow-enabled">Enabled</label>
                    <div><input id="workflow-enabled" type="checkbox" x-model="form.active" :disabled="!editing"></div>
                    <span class="label" x-show="job && job.needed_by && job.needed_by.length">Needed by</span>
                    <div id="workflow-needed-by" x-show="job && job.needed_by && job.needed_by.length">
                        <template x-for="(by, n) in job ? job.needed_by : []" :key="n">
                            <span><a :href="'workflow.html?key=' + encodeURIComponent(by.workflow)" x-text="by.job + ' in ' + by.workflow"></a><span x-show="n < job.needed_by.length - 1">, </span></span>
                        </template>
                        <span class="muted small">wait for this workflow, or for a job in it</span>
                    </div>
                    <span class="label">Would it run?</span>
                    <div id="runnability">
                        <span class="ready-text" x-show="check && check.valid">Ready to run</span>
                        <span class="muted" x-show="!job">Not yet saved</span>
                        <span class="muted small" x-show="changed">(as last saved, not as it is on screen)</span>
                        <ul class="problems" x-show="problems.length">
                            <template x-for="problem in problems"><li x-text="problem"></li></template>
                        </ul>
                        <ul class="warnings" id="check-warnings" x-show="warnings.length">
                            <template x-for="warning in warnings"><li class="message warning small" x-text="warning"></li></template>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- What happens after the workflow itself ends -->
            <section class="panel" aria-label="Reactions" id="reactions-panel">
                <h2 class="section" style="margin-top: 0">Reactions</h2>
                <p class="muted small">What happens after the workflow ends, as a whole. Each job's own are with it, below.</p>
                <div data-reactions-box data-list="form.reactions" data-in-workflow="false"></div>
            </section>

            <!-- The outline: each job, and what it waits for -->
            <section class="panel" aria-label="Jobs">
                <div class="steps-head">
                    <h2 class="section" style="margin-top: 0">Jobs</h2>
                    <span class="muted small">They run in parallel unless one waits for another. The order here is only
                        the order they are shown in.</span>
                </div>
                <div class="wf-toolbar">
                    <span class="group" role="group" aria-label="View">
                        <button type="button" id="view-diagram" :class="{ on: view === 'diagram' }" @click="setView('diagram')">Diagram</button>
                        <button type="button" id="view-outline" :class="{ on: view === 'outline' }" @click="setView('outline')">Outline</button>
                    </span>
                    <span class="group" role="group" aria-label="Direction" x-show="view === 'diagram'">
                        <button type="button" id="direction-right" :class="{ on: direction === 'RIGHT' }" @click="setDirection('RIGHT')">Left to right</button>
                        <button type="button" id="direction-down" :class="{ on: direction === 'DOWN' }" @click="setDirection('DOWN')">Top to bottom</button>
                    </span>
                    <span class="group" role="group" aria-label="Zoom" x-show="view === 'diagram'">
                        <button type="button" id="zoom-out" title="Smaller" @click="setZoom(-1)">−</button>
                        <button type="button" id="zoom-fit" title="Fit to the window" :class="{ on: zoom === 'fit' }" @click="setZoom(0)">Fit</button>
                        <button type="button" id="zoom-in" title="Larger" @click="setZoom(1)">+</button>
                    </span>
                    <label class="small" x-show="view === 'diagram'" title="Jobs and workflows elsewhere, and the jobs elsewhere that wait for a job here. Off: small icons in the header of the box they apply to">
                        <input type="checkbox" id="show-external" x-model="showExternal" @change="rememberExternal()"> Show external references</label>
                    <label class="small" x-show="view === 'diagram'" title="Files and times, which run nothing. Off: small icons in the header of the box they apply to">
                        <input type="checkbox" id="show-conditions" x-model="showConditions" @change="rememberExternal()"> Show non-executable dependencies</label>
                    <input type="search" id="find" x-model="find" placeholder="Find a job" aria-label="Find a job in this workflow, in its frames and in the workflows it uses"
                           x-effect="loadFindDetails(find)">
                    <span class="muted small" id="find-count" x-show="find.trim()"
                          x-text="foundAll.length ? foundAll.length + ' found' : 'No job here has a name containing that'"></span>
                </div>
                <ul class="wf-results" id="find-results" x-show="foundAll.length">
                    <template x-for="entry in foundAll" :key="entry.id">
                        <li><button type="button" @click="view === 'diagram' ? showFound(entry) : null" x-text="entry.label"
                                    :title="entry.uid ? 'Show matches: opens the way to it' : 'Inside a workflow of its own: opens it inline, read only'"></button></li>
                    </template>
                </ul>
                <p class="muted small wf-hint" x-show="view === 'diagram' && !sideShown"
                   x-text="editing ? 'Select a box to edit that job beside the diagram. Drag from one box to another to make the second wait for the first. Point at a line and click its x, or select it and press Delete, to remove it. Jobs changed since the last save are outlined.' : 'Select a box or a line to see it beside the diagram.'"></p>
                <p class="muted" x-show="!form.items.length && !editing">No jobs yet. Edit the workflow to add the jobs it should run.</p>
                <div :class="{ 'wf-body': view === 'diagram', wide: view === 'diagram', 'no-side': view === 'diagram' && !sideShown }"
                     x-ref="body" :style="{ '--side-width': (sideWidth || 560) + 'px' }">
                <div class="wf-canvas" id="diagram" x-show="view === 'diagram'" x-effect="drawDefinition($el)"
                     @keydown.window="removeSelectedLine($event)"></div>
                <div :class="{ 'wf-side': view === 'diagram' }" id="side" x-show="view === 'outline' || sideShown">
                <div class="wf-resize" x-show="view === 'diagram'" title="Drag to make this pane wider or narrower; double-click for its usual width"
                     @pointerdown="startResize($event)" @dblclick="resetSideWidth()"></div>
                <div class="wf-side-head" x-show="view === 'diagram'">
                    <button type="button" class="link small wf-side-close" @click="select(null, null)"
                            title="Hide this pane; select a box to show it again">Hide Job pane ×</button>
                </div>
                <ul class="wf-outline" id="outline">
                    <template x-for="item in outlineItems" :key="item.uid">
                        <li class="wf-item" :data-name="nameOf(item.uid)" x-show="isShown(item)"
                            :class="{ found: view === 'outline' && found.includes(item), 'wf-frame-item': item.embedded && item.jobType === 'WORKFLOW' }"
                            :style="view === 'outline' ? { marginLeft: (depthOf(item) * 22) + 'px' } : null"
                            :data-depth="depthOf(item)">
                            <!-- Locked: the outline in words -->
                            <template x-if="!editing">
                                <div>
                                    <div class="wf-row">
                                        <span class="wf-name" x-text="nameOf(item.uid)"></span>
                                        <a class="small" :href="jobLink(item)" x-show="!(item.embedded && item.jobType === 'WORKFLOW')"
                                           x-text="(item.embedded ? 'embedded job ' : 'job ') + item.job_key"></a>
                                        <span class="small muted" x-show="item.embedded && item.jobType === 'WORKFLOW'"
                                              x-text="'frame ' + item.job_key + ' (its jobs are indented below it)'"></span>
                                        <span class="tag" x-show="item.join === 'ANY'" title="Starts when any one of its prerequisites holds">Any</span>
                                        <span class="tag" x-show="item.join === 'CUSTOM'" title="Starts when its Custom rule holds">Custom rule</span>
                                        <span class="tag disabled-here" x-show="item.disabled_here" x-text="disabledHereWords(item)"></span>
                                    </div>
                                    <div class="wf-needs muted small" x-text="needs(item)"></div>
                                    <ul class="wf-outside-words muted small" x-show="item.outside.length">
                                        <template x-for="o in item.outside" :key="o.uid">
                                            <li><span class="tag outside" x-text="{ OTHER_JOB: 'Other workflow', ENDPOINT: 'Files', TIME: 'Time' }[o.kind]"></span>
                                                <span x-text="outsideWords(item, o) + '. ' + patienceWords(o)"></span></li>
                                        </template>
                                    </ul>
                                    <div class="wf-needed-by muted small" x-show="item.needed_by.length">
                                        <span class="tag outside">Needed by</span>
                                        <template x-for="(by, n) in item.needed_by" :key="n">
                                            <span><a :href="'workflow.html?key=' + encodeURIComponent(by.workflow)" x-text="by.job + ' in ' + by.workflow"></a><span x-show="n < item.needed_by.length - 1">, </span></span>
                                        </template>
                                    </div>
                                    <div class="muted small" x-show="item.on_unmet === 'FAIL'">If it can't start, it fails.</div>
                                    <div class="wf-use-variables muted small" x-show="item.variables.length"
                                         x-text="'Sets here: ' + item.variables.map(v => v.name).join(', ')"></div>
                                    <ul class="wf-reactions muted small" x-show="reactionsShown(item).length">
                                        <template x-for="r in reactionsShown(item)" :key="r.uid">
                                            <li x-text="reactionWords(r) + (item.reactions_overridden ? '' : ' (from the job)')"></li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                            <!-- Editing -->
                            <template x-if="editing">
                                <div class="wf-edit">
                                    <div class="wf-row">
                                        <button type="button" class="tool" title="Up" @click="moveItem(item, -1)" :disabled="isFirst(item)">▲</button>
                                        <button type="button" class="tool" title="Down" @click="moveItem(item, 1)"
                                                :disabled="isLast(item)">▼</button>
                                        <label x-show="!item.embedded">Job <input type="text" class="item-job" list="job-keys" x-model="item.job_key"
                                                          @focus="nameBefore = nameOf(item.uid)" @change="renamed(nameBefore, nameOf(item.uid), item)"
                                                          placeholder="Type to find a job" autocomplete="off"></label>
                                        <span class="small embedded-note" x-show="item.embedded"
                                              :title="'It belongs to this workflow, is not in the lists, and goes when the item goes. Its key follows the names above it until it has run.'"
                                              x-text="(item.jobType === 'WORKFLOW' ? 'Embedded workflow ' : 'Embedded job ') + (item.job_key || '(its key is made when you save)')"></span>
                                        <a class="small open-job" target="_blank" rel="noopener" :href="jobLink(item)"
                                           x-show="knownJob(item) && !(item.embedded && item.jobType === 'WORKFLOW')"
                                           title="Opens the job in a new tab. Saving it there does not touch this workflow.">Open job ↗</a>
                                        <label>Named <input type="text" class="item-name" x-model="item.name" maxlength="100"
                                                            @focus="nameBefore = nameOf(item.uid)" @change="renamed(nameBefore, nameOf(item.uid), item)"
                                                            :placeholder="item.embedded ? 'Name it' : placeholder(item)"></label>
                                        <label class="wf-disabled-here" title="Only in this workflow: the job itself stays as it is">Here it
                                            <select class="item-disabled-here" x-model="item.disabled_here">
                                                <option value="">runs</option>
                                                <option value="STOP">is disabled: stop here</option>
                                                <option value="PASS_THROUGH">is disabled: pass through, as if it succeeded</option>
                                            </select></label>
                                    </div>
                                    <fieldset class="wf-prereqs">
                                    <legend>Prerequisites</legend>
                                    <ul class="wf-prerequisites" x-show="item.join !== 'CUSTOM'">
                                        <template x-for="(p, pIndex) in item.prerequisites" :key="p.uid">
                                            <li class="wf-row" :class="{ chosen: p.uid === selectedLine }">
                                                <label title="The job in this workflow, by its name here, that this one waits for">Job in this workflow
                                                <select class="prereq-target" x-model.number="p.target">
                                                    <template x-for="other in others(item)" :key="other.uid">
                                                        <option :value="other.uid" x-text="nameOf(other.uid) || '(unnamed)'"
                                                                :selected="other.uid === p.target"></option>
                                                    </template>
                                                </select></label>
                                                <label title="What that job must have done">Outcome
                                                <select class="prereq-test" x-model="p.test">
                                                    <option value="SUCCESS">succeeded</option>
                                                    <option value="FAILED">failed</option>
                                                    <option value="ENDED">ended, whatever happened</option>
                                                    <option value="RC">gave return codes</option>
                                                </select></label>
                                                <input type="text" class="prereq-codes" x-show="p.test === 'RC'" x-model="p.return_codes"
                                                       placeholder="0, 4 or 0-4" maxlength="100" style="max-width: 140px">
                                                <button type="button" class="link small remove-prerequisite" @click="removePrerequisite(item, pIndex)"
                                                        title="Stop waiting for this job">Remove</button>
                                            </li>
                                        </template>
                                        <li x-show="!item.prerequisites.length" class="muted small">Starts when the workflow starts</li>
                                        <li><button type="button" class="link small add-prerequisite" @click="addPrerequisite(item)"
                                                    :disabled="others(item).length < 1">+ Wait for another job</button></li>
                                    </ul>
                                    <ul class="wf-outside-list">
                                        <template x-for="(o, oIndex) in item.outside" :key="o.uid">
                                            <li class="wf-outside-row" :data-outside-uid="o.uid" :data-kind="o.kind">
                                                <div class="wf-row">
                                                    <label title="What this job waits for outside its workflow">Waits for
                                                        <select class="outside-kind" x-model="o.kind" @change="outsideKindChanged(o)">
                                                            <option value="OTHER_JOB">a job in another workflow</option>
                                                            <option value="ENDPOINT">files</option>
                                                            <option value="TIME">a time</option>
                                                        </select></label>
                                                    <label title="What conditions call it. Left empty, it is made from what it is">Called
                                                        <input type="text" class="outside-name" x-model="o.name" maxlength="100"
                                                               :placeholder="outsideName(item, o)"
                                                               @focus="nameBefore = outsideName(item, o)"
                                                               @change="renamedOutside(item, nameBefore, outsideName(item, o))"></label>
                                                    <button type="button" class="link small remove-outside" @click="removeOutside(item, oIndex)"
                                                            title="Stop waiting for this">Remove</button>
                                                </div>
                                                <div class="wf-row" x-show="o.kind === 'OTHER_JOB'" x-effect="o.kind === 'OTHER_JOB' && loadJobDetail(o.workflow)">
                                                    <label>Workflow
                                                        <input type="text" class="outside-workflow" list="workflow-keys" x-model="o.workflow"
                                                               autocomplete="off" placeholder="Type to find a workflow"></label>
                                                    <label>Job in it
                                                        <select class="outside-job" x-model="o.job">
                                                            <option value="">the workflow as a whole</option>
                                                            <template x-for="name in workflowJobs(o.workflow)" :key="name">
                                                                <option :value="name" x-text="name" :selected="name === o.job"></option>
                                                            </template>
                                                        </select></label>
                                                    <label x-show="item.join !== 'CUSTOM'">Outcome
                                                        <select class="outside-test" x-model="o.test">
                                                            <option value="SUCCESS">succeeded</option>
                                                            <option value="FAILED">failed</option>
                                                            <option value="ENDED">ended, whatever happened</option>
                                                            <option value="RC">gave return codes</option>
                                                        </select></label>
                                                    <input type="text" class="outside-codes" x-show="item.join !== 'CUSTOM' && o.test === 'RC'"
                                                           x-model="o.return_codes" placeholder="0, 4 or 0-4" maxlength="100" style="max-width: 140px">
                                                    <p class="muted small" style="flex-basis: 100%; margin: 0">Its run that counts is the one going now, else the
                                                        latest that ended. To rule out a stale one:</p>
                                                    <label>only a run that ended within
                                                        <input type="number" min="1" class="outside-look-back" x-model="o.look_back_hours"
                                                               style="max-width: 80px" placeholder="any time"> hours</label>
                                                    <label><input type="checkbox" class="outside-after-start" x-model="o.only_after_start">
                                                        only a run started after this one did</label>
                                                </div>
                                                <div class="wf-row" x-show="o.kind === 'ENDPOINT'">
                                                    <label>Endpoint
                                                        <input type="text" class="outside-endpoint" list="lookup-endpoints" x-model="o.endpoint"
                                                               autocomplete="off" placeholder="Type to find an endpoint"></label>
                                                    <label>Files
                                                        <input type="text" class="outside-pattern" x-model="o.file_pattern" maxlength="256"
                                                               placeholder="The endpoint's own pattern"></label>
                                                    <label title="Every matching file must have been left alone this long, so a file still being written does not count">Each left alone for
                                                        <input type="number" min="0" class="outside-min-age" x-model="o.min_age_seconds"
                                                               style="max-width: 90px" placeholder="0"> seconds</label>
                                                    <p class="muted small" style="flex-basis: 100%; margin: 0">It holds when at least one file matches and
                                                        every matching file is old enough. Only files on this server. For a count or a size, use a Custom rule over
                                                        <code x-text="'%{' + outsideName(item, o) + '.FileCount}'"></code>.</p>
                                                </div>
                                                <div x-show="o.kind === 'TIME'">
                                                    <div data-condition-box data-model="o.time_condition" data-context="timeContext()"></div>
                                                    <p class="muted small">It waits until this is true. For a window across midnight, write
                                                        <code>%{Now.Time} IN WINDOW '18:00' TO '06:00'</code>. Server time.</p>
                                                </div>
                                                <div class="wf-row wf-patience">
                                                    <label>Waits
                                                        <select class="outside-wait-mode" x-model="o.wait_mode">
                                                            <option value="DEFAULT">up to the default wait (Settings)</option>
                                                            <option value="MINUTES">up to a number of minutes</option>
                                                            <option value="UNTIL">until a time</option>
                                                            <option value="NONE">with no limit</option>
                                                        </select></label>
                                                    <input type="number" min="1" class="outside-wait-minutes" x-show="o.wait_mode === 'MINUTES'"
                                                           x-model="o.wait_minutes" style="max-width: 90px" aria-label="Minutes">
                                                    <input type="time" class="outside-wait-until" x-show="o.wait_mode === 'UNTIL'"
                                                           x-model="o.wait_until" aria-label="Until">
                                                    <label x-show="['DEFAULT', 'MINUTES'].includes(o.wait_mode)">counted from when
                                                        <select class="outside-wait-from" x-model="o.wait_from">
                                                            <option value="OTHERS">the job's other prerequisites have held</option>
                                                            <option value="FIRST">the first of them has held</option>
                                                            <option value="CHOSEN">one I choose has held</option>
                                                            <option value="RUN_START">the workflow run started</option>
                                                        </select></label>
                                                    <select class="outside-wait-chosen" x-show="o.wait_from === 'CHOSEN' && ['DEFAULT', 'MINUTES'].includes(o.wait_mode)"
                                                            x-model.number="o.wait_from_uid" aria-label="Which prerequisite">
                                                        <option value="">(choose)</option>
                                                        <template x-for="c in waitChoices(item, o)" :key="c.uid">
                                                            <option :value="c.uid" x-text="c.label" :selected="c.uid === o.wait_from_uid"></option>
                                                        </template>
                                                    </select>
                                                    <label title="Optional: after its limit the job goes on without it. Required: the job can't start">
                                                        <input type="checkbox" class="outside-required" x-model="o.required"> Required</label>
                                                </div>
                                                <p class="message warning small outside-no-limit" x-show="o.wait_mode === 'NONE' && o.required">With no limit,
                                                    the job waits for ever if this never happens.</p>
                                                <p class="message error small outside-optional-limit" x-show="o.wait_mode === 'NONE' && !o.required">An optional
                                                    prerequisite is given up after its limit, so it needs one.</p>
                                            </li>
                                        </template>
                                        <li class="wf-add-outside">
                                            <button type="button" class="link small add-outside-job" @click="addOutside(item, 'OTHER_JOB')">+ Wait for a job in another workflow</button>
                                            <button type="button" class="link small add-outside-files" @click="addOutside(item, 'ENDPOINT')">+ Wait for files</button>
                                            <button type="button" class="link small add-outside-time" @click="addOutside(item, 'TIME')">+ Wait for a time</button>
                                        </li>
                                    </ul>
                                    <label class="wf-join" title="When this job starts">Start rule
                                        <select class="item-join" x-model="item.join" @change="joinChanged(item)">
                                            <option value="ALL" :disabled="item.join !== 'CUSTOM' && waitCount(item) < 2"
                                                    title="All and Any matter once it waits for two jobs or more">When all prerequisites are satisfied</option>
                                            <option value="ANY" :disabled="item.join !== 'CUSTOM' && waitCount(item) < 2"
                                                    title="All and Any matter once it waits for two jobs or more">When any prerequisite is satisfied</option>
                                            <option value="CUSTOM" title="A rule of your own, written as a condition over other jobs' outputs and variables">Custom rule</option>
                                        </select></label>
                                    <div class="wf-rule" x-show="item.join === 'CUSTOM'">
                                        <p class="muted small">It waits for the jobs the rule names, and starts as soon as the rule is true.</p>
                                        <div data-condition-box data-model="item.rule" data-context="ruleContext(item)"></div>
                                    </div>
                                    <label class="wf-join" title="What happens when a prerequisite can never hold, or a required one has run out of patience">If it can't start
                                        <select class="item-on-unmet" x-model="item.on_unmet">
                                            <option value="NOT_RUN">it does not run (Not run), and what waits for it goes on from there</option>
                                            <option value="FAIL">it fails (Failed)</option>
                                        </select></label>
                                    </fieldset>
                                    <fieldset class="wf-item-reactions">
                                        <legend>Reactions</legend>
                                        <template x-if="!item.reactions_overridden">
                                            <div>
                                                <p class="muted small" x-text="item.job_reactions.length ? 'From the job:' : (item.id ? 'The job has none.' : 'The job\'s own, if it has any, once saved.')"></p>
                                                <ol class="reaction-list muted small">
                                                    <template x-for="r in item.job_reactions" :key="r.uid"><li x-text="reactionWords(r)"></li></template>
                                                </ol>
                                                <button type="button" class="link small override-reactions" @click="overrideReactions(item)"
                                                        title="Give this use Reactions of its own, in place of the job's">Override here</button>
                                            </div>
                                        </template>
                                        <template x-if="item.reactions_overridden">
                                            <div>
                                                <p class="muted small">Its own, in place of the job's.
                                                    <button type="button" class="link small use-job-reactions" @click="useJobReactions(item)">Use the job's again</button></p>
                                                <div data-reactions-box data-list="item.reactions" data-in-workflow="true" data-targets="reactionTargets(item)"></div>
                                            </div>
                                        </template>
                                    </fieldset>
                                    <fieldset class="wf-item-variables">
                                        <legend>Variables for this use</legend>
                                        <p class="muted small">Set only when this workflow runs the job, over the job's own
                                            and the workflow's.</p>
                                        <div class="table-scroll" x-show="item.variables.length > 0">
                        <table class="results variables">
                            <thead><tr><th>Name</th><th>Value</th><th>Secret</th><th>Description</th><th></th></tr></thead>
                            <tbody>
                                <template x-for="(variable, vIndex) in item.variables" :key="variable.uid">
                                    <tr :data-variable="variable.uid">
                                        <td><input type="text" class="variable-name" x-model="variable.name" :disabled="!editing"
                                                   maxlength="100" placeholder="For example Region" aria-label="Variable name"></td>
                                        <td><input :type="variable.secret ? 'password' : 'text'" class="variable-value" x-model="variable.value"
                                                   :disabled="!editing" aria-label="Variable value" autocomplete="off"
                                                   :placeholder="variable.secret && variable.savedSecret ? 'Set. Type a new value to replace it.' : ''"></td>
                                        <td><input type="checkbox" class="variable-secret" x-model="variable.secret" :disabled="!editing"
                                                   title="A secret's value is hidden here, in the job log and in previews, and is never sent back to this page"
                                                   aria-label="Secret"></td>
                                        <td><input type="text" class="variable-description" x-model="variable.description" :disabled="!editing"
                                                   aria-label="Variable description"></td>
                                        <td><button type="button" class="link remove-variable" x-show="editing"
                                                    @click="removeVariable(item.variables, vIndex)">Remove</button></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                                        <button type="button" class="link small add-use-variable" @click="addVariable(item.variables)">+ Add a variable here</button>
                                    </fieldset>
                                    <template x-if="item.embedded">
                                    <fieldset class="wf-embedded">
                                        <legend x-text="item.jobType === 'WORKFLOW' ? 'This workflow (a frame)' : 'This job'"></legend>
                                        <label>Description <input type="text" class="embedded-description" x-model="item.inner.description"></label>
                                        <label><input type="checkbox" class="embedded-active" x-model="item.inner.active"> Enabled</label>
                                        <p class="muted small" x-show="item.jobType === 'STEPS' && !item.id">Save the workflow first, then open this job to give it steps.</p>
                                        <div x-show="item.jobType === 'WORKFLOW'" class="wf-frame-tools">
                                            <p class="muted small">Its jobs are indented below it. What it carries reaches every job inside it.</p>
                                            <button type="button" class="link small add-inside-existing" @click="addItem(item.uid, 'existing')">+ Use an existing job here</button>
                                            <button type="button" class="link small add-inside-job" @click="addItem(item.uid, 'job')">+ New job here</button>
                                            <button type="button" class="link small add-inside-workflow" @click="addItem(item.uid, 'workflow')">+ New workflow here</button>
                                            <h4 class="small">Variables of this workflow</h4>
                                            <template x-for="(variable, vIndex) in item.inner ? item.inner.variables : []" :key="variable.uid">
                                                <div class="wf-row" :data-variable="variable.uid">
                                                    <input type="text" class="variable-name" x-model="variable.name" maxlength="100" placeholder="For example Region" aria-label="Variable name">
                                                    <input :type="variable.secret ? 'password' : 'text'" class="variable-value" x-model="variable.value" aria-label="Variable value" autocomplete="off"
                                                           :placeholder="variable.secret && variable.savedSecret ? 'Set. Type a new value to replace it.' : ''">
                                                    <label class="small"><input type="checkbox" class="variable-secret" x-model="variable.secret"> Secret</label>
                                                    <button type="button" class="link small remove-variable" @click="removeVariable(item.inner.variables, vIndex)">Remove</button>
                                                </div>
                                            </template>
                                            <button type="button" class="link small add-frame-variable" @click="addVariable(item.inner.variables)">+ Add a variable to this workflow</button>
                                        </div>
                                    </fieldset>
                                    </template>
                                    <button type="button" class="link small make-shared" x-show="item.embedded && item.id" @click="makeShared(item)"
                                            title="Give it a key of its own and list it, so other workflows can use it">Make shared…</button>
                                    <button type="button" class="link small embed-copy" x-show="!item.embedded && item.id && knownJob(item)" @click="embedCopy(item)"
                                            title="Run a copy of this job that belongs to this workflow, so this use can differ. Later changes to the original do not reach it">Use an embedded copy</button>
                                    <button type="button" class="link small remove-item" @click="removeItem(item)"
                                            :title="item.embedded ? 'Take this out of the workflow. It is deleted with everything in it' : 'Take this job out of the workflow'"
                                            x-text="item.embedded ? 'Remove this and delete it' : 'Remove this job'"></button>
                                </div>
                            </template>
                            <!-- Its steps, read only, and where each ${Name} in them gets its value here -->
                            <details class="wf-steps" :open="view === 'diagram'" x-show="knownJob(item)"
                                     x-effect="loadJobDetail(item.job_key)">
                                <summary>Steps of this job</summary>
                                <p class="muted small">Read only. <a class="open-job-steps" target="_blank" rel="noopener" :href="jobLink(item)">Open the job in a new tab</a>
                                    to change it. Saving it there does not touch this workflow; reload this page to see the change.</p>
                                <p class="muted small" x-show="isWorkflowJob(item) && !item.embedded">This job is itself a workflow: open it to see its jobs.</p>
                                <ol class="wf-step-list">
                                    <template x-for="row in stepRows(item)" :key="row.key">
                                        <li :style="{ paddingLeft: (row.depth * 16) + 'px' }" :class="{ muted: !row.active }">
                                            <span class="muted" x-text="row.number + '.'"></span>
                                            <strong x-text="row.title"></strong>
                                            <span class="muted small" x-text="row.type + (row.active ? '' : ' (disabled)')"></span>
                                            <ul class="wf-step-uses small" x-show="row.uses.length">
                                                <template x-for="use in row.uses" :key="use.param">
                                                    <li><code x-text="use.param"></code>: <code x-text="use.text"></code>
                                                        <ul>
                                                            <template x-for="source in use.sources" :key="source.name">
                                                                <li :class="{ 'no-value': !source.where }">
                                                                    <code x-text="'$' + '{' + source.name + '}'"></code>
                                                                    <span x-text="source.where ? '= ' + source.value + ', from ' + source.where
                                                                                  : 'has no value here: set it on this use, the workflow, the job or a tag'"></span>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </li>
                                                </template>
                                            </ul>
                                        </li>
                                    </template>
                                </ol>
                            </details>
                        </li>
                    </template>
                </ul>
                </div>
                </div>
                <span x-show="editing">
                    <button type="button" class="secondary" id="add-job" @click="addItem()">+ Add a job</button>
                    <button type="button" class="secondary" id="add-new-job" @click="addItem(null, 'job')"
                            title="A job that belongs to this workflow and is not in the lists">+ New job here</button>
                    <button type="button" class="secondary" id="add-new-workflow" @click="addItem(null, 'workflow')"
                            title="A workflow that belongs to this one, drawn as a frame around its jobs">+ New workflow here</button>
                </span>
                <details class="wf-key" x-show="view === 'diagram'">
                    <summary>Key</summary>
                    <div class="wf-legend" id="key" x-effect="drawKey($el)"></div>
                </details>
            </section>

            <!-- Completion rules: when the workflow succeeds, and the return code it ends with -->
            <section class="panel" aria-label="When it succeeds" id="completion-panel">
                <h2 class="section" style="margin-top: 0">When the workflow succeeds</h2>
                <div class="detail-grid">
                    <label for="succeeds-choice">It succeeds</label>
                    <div>
                        <select id="succeeds-choice" x-model="form.succeeds_choice" :disabled="!editing">
                            <option value="DEFAULT">unless a failure went unhandled (the default)</option>
                            <option value="RULE">when a condition holds</option>
                        </select>
                        <div class="succeeds-when" x-show="form.succeeds_choice === 'RULE'">
                            <div data-condition-box data-model="form.succeeds_when" data-context="completionContext()"></div>
                        </div>
                    </div>
                    <label for="return-code-from">Its return code</label>
                    <select id="return-code-from" x-model="form.return_code_from" :disabled="!editing">
                        <option value="">0 if it succeeded, 1 if not (the default)</option>
                        <template x-for="name in itemNames()" :key="name">
                            <option :value="name" x-text="'the one ' + name + ' ended with'" :selected="name === form.return_code_from"></option>
                        </template>
                    </select>
                </div>
            </section>

            <!-- Its recent runs -->
            <!-- Its variables: every job it runs sees them, fixed when the run starts -->
            <section class="panel" aria-label="Variables" id="variables-panel">
                <div class="steps-head">
                    <h2 class="section" style="margin-top: 0">Variables</h2>
                    <span class="muted small">Every job in this workflow sees them as <code>${Name}</code>. A job's own variable of
                        the same name wins, and so does a use's, set on the job below. Their values are fixed when a run starts.</span>
                </div>
                <p class="message" id="no-variables" x-show="form.variables.length === 0">This workflow has no variables of its own.</p>
                <div class="table-scroll" x-show="form.variables.length > 0">
                        <table class="results variables">
                            <thead><tr><th>Name</th><th>Value</th><th>Secret</th><th>Description</th><th></th></tr></thead>
                            <tbody>
                                <template x-for="(variable, vIndex) in form.variables" :key="variable.uid">
                                    <tr :data-variable="variable.uid">
                                        <td><input type="text" class="variable-name" x-model="variable.name" :disabled="!editing"
                                                   maxlength="100" placeholder="For example Region" aria-label="Variable name"></td>
                                        <td><input :type="variable.secret ? 'password' : 'text'" class="variable-value" x-model="variable.value"
                                                   :disabled="!editing" aria-label="Variable value" autocomplete="off"
                                                   :placeholder="variable.secret && variable.savedSecret ? 'Set. Type a new value to replace it.' : ''"></td>
                                        <td><input type="checkbox" class="variable-secret" x-model="variable.secret" :disabled="!editing"
                                                   title="A secret's value is hidden here, in the job log and in previews, and is never sent back to this page"
                                                   aria-label="Secret"></td>
                                        <td><input type="text" class="variable-description" x-model="variable.description" :disabled="!editing"
                                                   aria-label="Variable description"></td>
                                        <td><button type="button" class="link remove-variable" x-show="editing"
                                                    @click="removeVariable(form.variables, vIndex)">Remove</button></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                <div class="actions" x-show="editing">
                    <button type="button" class="secondary" id="add-variable" @click="addVariable(form.variables)">Add variable</button>
                </div>
                <!-- Then what its tags give its jobs -->
                <div data-tags-give></div>
            </section>

            <!-- Its tags, and the variables they give -->
            <div data-tags-panel></div>

            <section class="panel" aria-label="Runs" x-show="job">
                <h2 class="section" style="margin-top: 0">Recent runs</h2>
                <p class="muted" x-show="!runs.length">It has not run yet.</p>
                <table class="results" x-show="runs.length" id="runs">
                    <thead><tr><th>Started</th><th>Status</th><th>Instance</th><th>Ended</th><th></th></tr></thead>
                    <tbody>
                        <template x-for="r in runs" :key="r.run_id">
                            <tr>
                                <td class="nowrap" x-text="time(r.started)"></td>
                                <td><span class="status" :class="r.status" x-text="r.status"></span>
                                    <span class="muted small" x-show="r.reason" x-text="r.reason"></span></td>
                                <td x-text="r.instance_id"></td>
                                <td class="nowrap" x-text="time(r.ended) || '—'"></td>
                                <td><button type="button" class="link" @click="showRun(r.run_id)">Show</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </section>
        </div>
    </template>
</main>
<script>AutoApp.fillTagPanels(); AutoApp.fillReactionBoxes(); AutoApp.fillConditionBoxes()</script>
</body>
</html>
